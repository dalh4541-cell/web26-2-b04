<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반응/상태/구조 선택자</title>
    <style>
        h1:hover{color: red;}
        h1:active{color: blue;}

        /* input태그가 사용 가능할 때 background-color속성에 lightcyan 키워드를 적용합니다. */
        input:enabled{background-color: lightcyan;}
        /* input태그가 사용 불가능할 때 background-color속성에 darkgray 키워드를 적용합니다. */
        input:disabled{background-color: darkgray;}
        /* input태그가 포커스를 맞출 때 background-color속성에 lavender 키워드를 적용합니다. */
        input:focus{background-color:lavender;}
    </style>
</head>
<body>
    
    <h1>1.반응 선택자</h1>
    <h1>2.상태 선택자</h1>

    <h2>사용 가능</h2>
    <input>
        <h2>사용 불가능</h2>
        <input disabled="disabled">
</body>
</html>
