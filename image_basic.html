<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>image_basic</title>
</head>

<body>
    <h2>이미지 삽입하기</h2>
    <img src="Penguins.jpg" alt="펭귄" width="300">
    <img src="Nothing" alt="이미지 없음" width="300">

    <img src=" https://mblogthumb-phinf.pstatic.net/MjAxODA4MTRfMTg5/MDAxNTM0MjMxMjc2NDg0.nN09_SoZ3mJwyUmMojQTWIvyFSogw_BzuD9QvY0pXsMg.zj66-K3JIfjREQqTrm3byi1fGtYbv04NBpoQ2vISYhwg.JPEG.luckynjoy/1.jpg?type=w800
" width="300">

    <h2>음악 삽입하기</h2>
    <audio src="Kalimba.mp3" controls="controls"></audio>

    <h2>웹 브라우저 제약이 없도록 음악 삽입</h2>
    <audio controls="controls">
        <source src="Kalimba.mp3" type="audio/mp3">
        <source src="Kalimba.ogg" type="audio/ogg">

    </audio>

    <h2>동영상 삽입</h2>
    <video controls="controls">
        <source src="Wildlife.mp4" type="video/mp4">
        <source src="Wildlife.webm" type="video/webm">

    </video>
    
    <h2>동영상 불러오는 동안 다른 이미지 보여주기</h2>
    <video controls="controls" poster="character.jpeg" width="300">
        <source src="Wildlife.mp4" type="video/mp4" width="300">
        <source src="Wildlife.webm" type="video/webm">

    </video>
</body>

</html>
