<!DOCTYPE html>
<html lang="ko
    <meta charset=" UTF-8">

<title>form_selectbasic</title>
</head>

<body>
    <h2>선택 가능한 입력 양식</h2>
    <select>
        <option>라면</option>
        <option>치킨</option>
        <option>피자</option>
        <option>떡볶이</option>
    </select>

    <h2>여러 항목 선택하기</h2>
    <select multiple="multiple">
        <option>라면</option>
        <option>치킨</option>
        <option>피자</option>
        <option>떡볶이</option>
    </select>

    <h2>선택 옵션 묶기</h2>
    <select>
        <optgroup label="HTML5">
            <option>Multimedia Tag</option>
            <option>Connectivity</option>
            <option>Device Access</option>
        </optgroup>
        <optgroup label="CSS3">
            <option>Animation</option>
            <option>3D Transform</option>
        </optgroup>
    </select>
</body>

</html>
